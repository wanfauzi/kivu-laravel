[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["if [ ! -f .env ]; then cp .env.example .env; fi", "composer install --no-dev --no-interaction --optimize-autoloader --no-scripts", "npm ci"]

[phases.build]
cmds = ["npm run build", "php artisan package:discover --ansi || true", "php artisan config:clear || true"]

[start]
cmd = "php artisan migrate --force && php artisan storage:link || true && php artisan config:cache && php artisan serve --host 0.0.0.0 --port $PORT"
